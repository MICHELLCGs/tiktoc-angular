<div class="details">
  <div class="description">
    <p>{{ description }}</p>
    <div class="tags">
      <span *ngFor="let tag of tags">#{{ tag }} </span>
    </div>
  </div>
  <div class="links">
    <app-platform-link [link]="'https://example.com'" [isActivated]="true">
    </app-platform-link>
    <app-platform-link [link]="'https://example.com'" [isActivated]="false">
    </app-platform-link>
  </div>
</div>
