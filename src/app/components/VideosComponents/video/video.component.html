<div class="video-container">
    <app-video-player [videoUrl]="videoUrl"></app-video-player>
    <div>
      <app-video-actions 
        [likes]="likes" 
        [comments]="comments" 
        (onLike)="handleLike()" 
        (onComment)="handleComment()" 
        (onShare)="handleShare()">
      </app-video-actions>
      <app-video-details 
        [description]="description" >
      </app-video-details>
    </div>
</div>
