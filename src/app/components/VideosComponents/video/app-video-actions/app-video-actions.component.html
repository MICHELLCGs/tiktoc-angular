<div class="actions">
    <button (click)="like()" class="action">
      <img src="assets/icons/heart.svg" alt="Me gusta" />
      <span>{{ likes }}</span>
    </button>
    <button (click)="comment()" class="action">
      <img src="assets/icons/comment.svg" alt="Comentarios" />
      <span>{{ comments }}</span>
    </button>
    <button (click)="share()" class="action">
      <img src="assets/icons/share.svg" alt="Compartir" />
    </button>
  </div>
