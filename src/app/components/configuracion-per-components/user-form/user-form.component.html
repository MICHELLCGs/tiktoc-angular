<form class="user-form">
    <!-- Nombre -->
    <div class="input-group">
      <label for="name">Nombre</label>
      <input type="text" id="name" placeholder="Nombre" [(ngModel)]="userData.name" [ngModelOptions]="{standalone: true}" />
    </div>
  
    <!-- Correo -->
    <div class="input-group">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="Correo electrónico" [(ngModel)]="userData.email" [ngModelOptions]="{standalone: true}" />
    </div>
  
    <!-- Contraseña -->
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña" [(ngModel)]="userData.password" [ngModelOptions]="{standalone: true}" />
    </div>
  
    <!-- Sexo -->
    <div class="input-group">
      <label for="gender">Sexo</label>
      <select id="gender" [(ngModel)]="userData.gender" [ngModelOptions]="{standalone: true}">
        <option value="" disabled selected>Seleccionar</option>
        <option value="male">Masculino</option>
        <option value="female">Femenino</option>
      </select>
    </div>
  
    <!-- Teléfono -->
    <div class="input-group">
      <label for="phone">Teléfono</label>
      <input type="tel" id="phone" placeholder="Teléfono" [(ngModel)]="userData.phone" [ngModelOptions]="{standalone: true}" />
    </div>
  
    <!-- Fecha de nacimiento -->
    <div class="input-group">
      <label for="dob">Fecha de nacimiento</label>
      <div class="dob-container">
        <input type="text" id="dob-day" placeholder="Día" maxlength="2" [(ngModel)]="userData.birthDay" [ngModelOptions]="{standalone: true}" />
        <input type="text" id="dob-month" placeholder="Mes" maxlength="2" [(ngModel)]="userData.birthMonth" [ngModelOptions]="{standalone: true}" />
        <input type="text" id="dob-year" placeholder="Año" maxlength="4" [(ngModel)]="userData.birthYear" [ngModelOptions]="{standalone: true}" />
      </div>
    </div>

  </form>
