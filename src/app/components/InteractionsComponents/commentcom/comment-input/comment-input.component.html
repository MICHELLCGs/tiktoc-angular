<div class="comment-input">
    <input
      [(ngModel)]="newComment"
      type="text"
      placeholder="Escribe un comentario"
      class="input-field"
    />
    <button (click)="sendComment()" class="send-button">
      <img src="https://img.icons8.com/material-rounded/24/ffffff/filled-sent.png" alt="Enviar">
    </button>
  </div>
