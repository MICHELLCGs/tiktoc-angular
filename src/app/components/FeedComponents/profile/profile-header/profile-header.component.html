<div class="profile-header">
    <img src="assets/user-profile.jpg" alt="Foto de perfil" class="profile-picture" />
    <div class="profile-info">
      <h2>{{ username }}</h2>
      <p>{{ level }}</p>
      <div class="profile-stats">
        <span>Monedas: {{ coins }}</span>
        <span>Encuestas hechas: {{ surveysCompleted }}</span>
      </div>
    </div>
  </div>
