<div class="profile-header">
    <!-- Imagen del avatar -->
    <img [src]="avatarUrl" alt="Foto de perfil" class="profile-picture" />
  
    <!-- Información del usuario -->
    <div class="profile-info">
      <h2>{{ username }}</h2>
      <div class="user-level">
        <p>{{ level }}</p>
      </div>
  
      <!-- Estadísticas del perfil -->
      <div class="profile-stats">
        <div class="stat-item">
          <img src="assets/level-icon.svg" alt="Nivel" class="stat-icon" />
          <span>{{ level }}</span>
        </div>
        <div class="stat-item">
          <img src="assets/coin-icon.svg" alt="Monedas" class="stat-icon" />
          <span>{{ coins }}</span>
        </div>
        <div class="stat-item">
          <img src="assets/survey-icon.svg" alt="Encuestas hechas" class="stat-icon" />
          <span>{{ surveysCompleted }}</span>
        </div>
      </div>
    </div>
  </div>
